description: >-
  💎 LiteRT Gemma brings Google's production-ready LiteRT-LM inference runtime and the Gemma family of Large Language Models directly to your Raspberry Pi 4 on umbrelOS.

  Engineered specifically for low-power, edge-native compute, LiteRT Gemma utilizes ARM Neon CPU acceleration with XNNPACK/YNNPACK delegates to deliver smooth, private, local AI inference without burning through your system resources.

  Key Features:
  • Built for Edge: Optimized for ARM64 with minimal memory footprint (~1.2–1.8 GB RAM), leaving plenty of memory for other Umbrel apps.
  • Interactive Web Chat UI: A clean, modern, responsive chat interface featuring streaming responses, markdown rendering, and syntax highlighting.
  • OpenAI-Compatible API: Fully exposes standard endpoints (`/v1/chat/completions` and `/v1/models`) on port 20135, allowing instant integration with OmniRoute, OpenWebUI, Cursor, Cline, and agentic workflows.
  • Auto Model Downloader: Automatically downloads and caches quantized Gemma `.litertlm` models in your Umbrel app storage so they persist across container updates.
  • 100% Private & Offline: Operates entirely on your local Umbrel hardware with zero external telemetry.

  ---
  **Technical Source:** Powered by [Google AI Edge LiteRT-LM](https://github.com/google-ai-edge/LiteRT-LM).
