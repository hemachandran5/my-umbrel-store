<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="256" height="256" rx="56" fill="url(#omniGrad)" />
  
  <!-- Network Routing Lines -->
  <line x1="128" y1="128" x2="64" y2="64" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="128" y1="128" x2="192" y2="64" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="128" y1="128" x2="64" y2="192" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="128" y1="128" x2="192" y2="192" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="128" y1="128" x2="128" y2="44" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="8 8" />
  <line x1="128" y1="128" x2="212" y2="128" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="8 8" />
  <line x1="128" y1="128" x2="128" y2="212" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="8 8" />
  <line x1="128" y1="128" x2="44" y2="128" stroke="white" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="8 8" />

  <!-- Outer Satellite Nodes -->
  <circle cx="64" cy="64" r="16" fill="white" filter="url(#glow)" />
  <circle cx="192" cy="64" r="16" fill="white" filter="url(#glow)" />
  <circle cx="64" cy="192" r="16" fill="white" filter="url(#glow)" />
  <circle cx="192" cy="192" r="16" fill="white" filter="url(#glow)" />

  <circle cx="128" cy="44" r="9" fill="white" fill-opacity="0.8" />
  <circle cx="212" cy="128" r="9" fill="white" fill-opacity="0.8" />
  <circle cx="128" cy="212" r="9" fill="white" fill-opacity="0.8" />
  <circle cx="44" cy="128" r="9" fill="white" fill-opacity="0.8" />

  <!-- Central Hub Node -->
  <circle cx="128" cy="128" r="30" fill="white" filter="url(#glow)" />
  <circle cx="128" cy="128" r="16" fill="#7C3AED" />
  <circle cx="128" cy="128" r="8" fill="white" />
</svg>
