version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hemsk-nodepm_server_1
      APP_PORT: 20130
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/hemachandran5/hemsk-nodepm:latest
    user: "0:0"
    restart: on-failure
    stop_grace_period: 40s
    environment:
      - PORT=20130
      - DATA_DIR=/app/data
      - NPM_CONFIG_PREFIX=/app/data/npm-global
      - NPM_CONFIG_CACHE=/app/data/npm-cache
      - HOME=/app/data/home
      - PM2_HOME=/app/data/home/.pm2
      - PATH=/app/data/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - STORAGE_ENCRYPTION_KEY=nodepm-persistent-storage-key-pi4-umbrel-secure
      - JWT_SECRET=nodepm-persistent-jwt-session-key-pi4-umbrel-secure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    ports:
      - "20128:20128" # OmniRoute AI Gateway
      - "20129:20129" # 9Router AI Proxy
      - "8080:8080"   # Free LLM API
      - "3000:3000"   # Generic Node App 1
      - "3001:3001"   # Generic Node App 2
