<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c35"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="28 16" opacity="0.4" filter="url(#glow)"/>
  
  <circle cx="256" cy="80" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="432" cy="256" r="14" fill="#4ade80" filter="url(#glow)"/>
  <circle cx="256" cy="432" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="80" cy="256" r="14" fill="#4ade80" filter="url(#glow)"/>

  <g transform="translate(256, 256)">
    <path d="M 0,-120 L 104,-60 L 104,60 L 0,120 L -104,60 L -104,-60 Z" fill="#0f172a" stroke="url(#nodeGrad)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M 0,-120 L 0,0 L 104,60" fill="none" stroke="#22c55e" stroke-width="6" opacity="0.7"/>
    <path d="M -104,60 L 0,0" fill="none" stroke="#22c55e" stroke-width="6" opacity="0.7"/>

    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
    <path d="M -16,-20 L 8,0 L -16,20 Z" fill="#38bdf8"/>
    <path d="M 4,-20 L 28,0 L 4,20 Z" fill="#4ade80"/>
  </g>
</svg>
