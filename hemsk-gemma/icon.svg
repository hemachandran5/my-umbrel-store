<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a1c2e" />
    </linearGradient>

    <!-- Gemma Facet Gradients -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80E9FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="facetCenterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="3" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="245" r="140" fill="#2563EB" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="275" r="85" fill="#EC4899" opacity="0.2" filter="url(#glow)" />

  <!-- Neural Edge Circuit Accent Lines -->
  <path d="M 80 390 L 160 390 L 210 340" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.35" fill="none" />
  <circle cx="80" cy="390" r="4.5" fill="#38BDF8" opacity="0.6" />
  <path d="M 432 390 L 352 390 L 302 340" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" opacity="0.35" fill="none" />
  <circle cx="432" cy="390" r="4.5" fill="#818CF8" opacity="0.6" />

  <!-- Gemma Faceted Crystal Emblem -->
  <g transform="translate(256, 240) scale(1.18)" filter="url(#subtleGlow)">
    <!-- Top Apex -->
    <polygon points="0,-115 -75,-40 0,-15" fill="url(#facetTop)" opacity="0.95" />
    <polygon points="0,-115 0,-15 75,-40" fill="#BAE6FD" opacity="0.9" />

    <!-- Upper Wings -->
    <polygon points="-75,-40 -105,35 0,-15" fill="url(#facetLeft)" />
    <polygon points="75,-40 0,-15 105,35" fill="url(#facetRight)" />

    <!-- Mid Inner Facets -->
    <polygon points="-105,35 -65,100 0,25" fill="url(#facetBottomLeft)" />
    <polygon points="105,35 0,25 65,100" fill="url(#facetBottomRight)" />

    <!-- Center Core Gem -->
    <polygon points="0,-15 -105,35 0,25" fill="#0284C7" opacity="0.85" />
    <polygon points="0,-15 0,25 105,35" fill="#38BDF8" opacity="0.75" />

    <!-- Bottom Point -->
    <polygon points="0,25 -65,100 0,120" fill="url(#facetCenterGlow)" />
    <polygon points="0,25 0,120 65,100" fill="#F43F5E" opacity="0.9" />

    <!-- Specular Highlight Lines -->
    <line x1="0" y1="-115" x2="0" y2="120" stroke="#FFFFFF" stroke-width="2.5" opacity="0.65" stroke-linecap="round" />
    <line x1="-105" y1="35" x2="105" y2="35" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Edge AI Badge at Bottom -->
  <g transform="translate(256, 436)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" ry="16" fill="#1e293b" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" letter-spacing="1.5" text-anchor="middle">AI-HUB</text>
  </g>
</svg>
