version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: gemma_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma_server_1
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "20135:8080"
    environment:
      - HF_HOME=/models
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    volumes:
      - ${APP_DATA_DIR}/data:/models
    command:
      - "--hf-repo"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
      - "--hf-file"
      - "qwen2.5-0.5b-instruct-q4_k_m.gguf"
      - "--models-dir"
      - "/models"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "2048"
      - "-t"
      - "4"
      - "--alias"
      - "qwen-0.5b"
