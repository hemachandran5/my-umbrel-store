version: "3.7"

services:
  server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma_server_1
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "20135:8080"
    environment:
      - HF_HOME=/models
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_HF_REPO=Qwen/Qwen2.5-0.5B-Instruct-GGUF
      - LLAMA_ARG_HF_FILE=qwen2.5-0.5b-instruct-q4_k_m.gguf
      - LLAMA_ARG_CTX_SIZE=2048
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_ALIAS=qwen-0.5b
    volumes:
      - ${APP_DATA_DIR}/data:/models
