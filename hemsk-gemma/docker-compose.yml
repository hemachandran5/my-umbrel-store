version: "3.7"

services:
  server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma_server_1
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "20135:8080"
    volumes:
      - ${APP_DATA_DIR}/data:/models
    entrypoint: ["sh", "-c"]
    command: >
      (test -f /models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf || curl -L -o /models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf") &&
      (test -f /models/Llama-3.2-1B-Instruct-Q4_K_M.gguf || curl -L -o /models/Llama-3.2-1B-Instruct-Q4_K_M.gguf "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf") &&
      (test -f /models/gemma-3-1b-it-Q4_K_M.gguf || curl -L -o /models/gemma-3-1b-it-Q4_K_M.gguf "https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf") &&
      exec /app/llama-server --models-dir /models --host 0.0.0.0 --port 8080 -c 2048 -t 4
