version: "3.7"

services:
  server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma_server_1
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "20135:20135"
    volumes:
      - ${APP_DATA_DIR}/data:/models
    entrypoint:
      - "sh"
      - "-c"
      - >
        mkdir -p /models;
        find /models/hub -name "*gemma-4*.gguf" -exec cp -l {} /models/gemma-4-E2B-it-Q4_K_M.gguf \; 2>/dev/null || true;
        if [ ! -f /models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf ]; then
          echo "Downloading Qwen 2.5 0.5B (15-22 tokens/sec)...";
          curl -L -o /models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf";
        fi;
        if [ ! -f /models/Llama-3.2-1B-Instruct-Q4_K_M.gguf ]; then
          echo "Downloading Llama 3.2 1B (8-10 tokens/sec)...";
          curl -L -o /models/Llama-3.2-1B-Instruct-Q4_K_M.gguf "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf";
        fi;
        if [ ! -f /models/gemma-3-1b-it-Q4_K_M.gguf ]; then
          echo "Downloading Gemma 3 1B (7-9 tokens/sec)...";
          curl -L -o /models/gemma-3-1b-it-Q4_K_M.gguf "https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf";
        fi;
        echo "Starting llama-server in Multi-Model Router Mode...";
        exec /app/llama-server --models-dir /models --host 0.0.0.0 --port 20135 -c 2048 -t 4version: "3.7"

