version: "1.1.0"
port: 20135
description: >-
  💎 Gemma & Fast LLMs brings a multi-model edge AI hub directly to your Raspberry Pi 4 on umbrelOS.

  Featuring an interactive web interface with a Model Dropdown Selector, you can easily switch between multiple models on the fly without restarting:

  Available Models:
  • Qwen 2.5 0.5B Instruct: ⚡ Blazing fast (~15–22 tokens/sec) — instant, real-time responses!
  • Llama 3.2 1B Instruct: 🚀 Fast (~8–10 tokens/sec) — Meta's latest lightweight, smart model.
  • Gemma 3 1B IT: 🚀 Fast (~7–9 tokens/sec) — Google's official compact Gemma model.
  • Gemma 4 E2B IT: 🧠 Advanced reasoning (~2 tokens/sec) — Google's cutting-edge multimodal model.

  Key Features:
  • Dynamic Memory Management: Automatically loads your selected model into RAM and frees unused models, keeping memory usage well within your Pi 4's 8 GB.
  • Interactive Web Chat UI: Full web interface with live streaming, system prompts, parameters, and instant model switching.
  • OpenAI-Compatible API: Fully exposes `/v1/chat/completions` and `/v1/models` on port 20135 for seamless integration with external tools and agent workflows.
  • 100% Private & Offline: Runs entirely on your local hardware.

  ---
  **Powered by:** llama.cpp Router Mode with ARM NEON acceleration.
