name: Build and Publish Node Process Manager Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'hemsk-nodepm/**'
      - '.github/workflows/build-nodepm.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 cross-compilation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: prep
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (linux/arm64 & linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./hemsk-nodepm
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/hemsk-nodepm:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/hemsk-nodepm:1.0.0
