version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: hemsk-odysseus_odysseus_1
      APP_PORT: "7000"
      PROXY_AUTH_ADD: "false"

  odysseus:
    image: bigbeartechworld/big-bear-odysseus:2026.10.05@sha256:9229314941f0f6ba9608232f57408f5a835e133abb6c770567f50abd1c1cb41e
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      AUTH_ENABLED: "true"
      # Do not commit ODYSSEUS_ADMIN_PASSWORD to a public repository.
      # This image should initialize its admin credential on first start;
      # see README.md for checking the container logs.
      SEARXNG_INSTANCE: http://searxng:8080
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hemsk_odysseus_network
      - default

  chromadb:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ${APP_DATA_DIR}/chromadb:/chroma/chroma
    networks:
      - hemsk_odysseus_network

  searxng:
    image: searxng/searxng:2026.6.2-e964708c0@sha256:0872beb1d495d41f2dda73d7aea83746657afdd2be3010eb1b11f5a541555c9e
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ]; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          cat > /etc/searxng/settings.yml <<EOF_SETTINGS
        use_default_settings: true
        server:
          secret_key: "$$secret"
        search:
          formats:
            - html
            - json
        EOF_SETTINGS
        fi
        exec /usr/local/searxng/entrypoint.sh
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      # SEARXNG_SECRET is intentionally unset so SearXNG can generate a
      # per-install secret on first boot and persist it in settings.yml.
    volumes:
      - ${APP_DATA_DIR}/searxng:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 10s
    networks:
      - hemsk_odysseus_network

  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: http://localhost:8091
    volumes:
      - ${APP_DATA_DIR}/ntfy:/var/cache/ntfy
    networks:
      - hemsk_odysseus_network

networks:
  hemsk_odysseus_network:
    driver: bridge
